<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging Out - PlanMyTrip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2 { font-family: 'Outfit', sans-serif; }
        .bg-gradient-premium { background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%); }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-10 text-center border border-gray-100">
        <div class="w-20 h-20 bg-indigo-50 rounded-2xl flex items-center justify-center mx-auto mb-8 animate-bounce">
            <i data-lucide="log-out" class="w-10 h-10 text-indigo-600"></i>
        </div>
        
        <h1 class="text-3xl font-black text-gray-900 mb-4">Logging You Out</h1>
        <p class="text-gray-500 mb-8 leading-relaxed">Closing your travel dashboard and securing your account. Redirecting you to the home page in a few moments...</p>

        <div class="flex flex-col gap-4">
            <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden mb-4">
                <div id="progress-bar" class="bg-gradient-premium h-full w-0 transition-all duration-[3000ms] ease-linear"></div>
            </div>
            
            <p class="text-sm font-bold text-gray-400 uppercase tracking-widest">Safe Travels!</p>
        </div>

        <div class="mt-10 pt-10 border-t border-gray-50">
            <a href="../login.html" class="text-indigo-600 font-bold hover:text-indigo-700 underline underline-offset-4">
                Click here if you aren't redirected
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        // Start progress bar animation
        setTimeout(() => {
            document.getElementById('progress-bar').style.width = '100%';
        }, 100);

        // Core logout logic
        function handleLogout() {
            // Clear all user session data
            localStorage.removeItem('planmytrip_user');
            localStorage.removeItem('user_session');
            sessionStorage.clear();
            
            // Redirect after 3.5 seconds
            setTimeout(() => {
                window.location.href = '../login.html'; 
            }, 3500);
        }

        window.onload = handleLogout;
    </script>
</body>
</html>
